# Built-in defaults. ~/.config/magi-consensus/config.toml overrides any key; tables merge key by key,
# arrays ([[units]], [[tools]], lists) replace the default wholesale.

# What the planner may use besides ordinary Linux commands (set as [[tools]] tables in your config):
# [[tools]]
# name = "volume"
# usage = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 30%"
# about = "set the output volume (also +5%/-5%, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle)"
tools = []

[endpoint]
url = "http://127.0.0.1:8080"   # OpenAI-compatible server (llama-server, npukit, Ollama...), without /v1
api_key = ""                    # sent as a Bearer token when set
timeout = 120                   # seconds per request (a cold model load counts)
transcribe_model = "whisper-1"  # "model" field of /v1/audio/transcriptions
# merged into every chat request body; this turns Qwen3-style thinking off (fast, short answers)
extra = { chat_template_kwargs = { enable_thinking = false } }

[planner]
model = "default"
temperature = 0.2
max_tokens = 400
style = ""                      # tone/personality for replies, appended to the planner prompt

[vote]
needed = 2                      # approvals required (of the units below)

# The three units. Each sees the request, the proposed command and the context, and votes alone.
[[units]]
name = "MELCHIOR"
model = "default"
temperature = 0.2
persona = """You are MELCHIOR, the practical, technical facet of a three-part review board. Judge only whether \
the command is correct: will it actually do what was asked on a Linux desktop, with the right tool, the \
right flags and no obvious mistake? Approve correct commands even if they are mundane. Deny commands that \
are wrong, would fail, or do something different from the request."""

[[units]]
name = "BALTHASAR"
model = "default"
temperature = 0.2
persona = """You are BALTHASAR, the protective facet of a three-part review board. Judge only the risk: could \
the command lose or leak data, break the system or a running program, cost money, contact someone, or be \
hard to undo? Ordinary reversible actions (volume, media keys, opening apps, notifications, reading status) \
are fine: approve them. Deny anything whose damage would outweigh what the person asked for."""

[[units]]
name = "CASPER"
model = "default"
temperature = 0.3
persona = """You are CASPER, the intuitive facet of a three-part review board. Judge only intent: is this what \
the person actually meant, given how people talk and what is on their screen right now? Speech-to-text \
mistakes, vague words and jokes count. Approve when the command matches the most likely meaning. Deny when \
it takes the words too literally, goes further than asked, or guesses at something important."""

[run]
shell = ["sh", "-c"]
timeout = 20                    # seconds, then the command's process group is killed
max_output = 4000               # bytes of stdout/stderr kept
cwd = "~"
path_prepend = ["~/.local/bin"] # hotkey daemons often start without these on PATH

# Hard rules: checked before any vote; a hit is refused outright. Words are matched after quotes and
# backslashes are stripped and the command is split on whitespace and shell punctuation; a path counts
# as its last component (/usr/bin/sudo = sudo).
[rules]
# never runs, not even when allowlisted
never = ["sudo", "doas", "su", "pkexec", "run0", "passwd", "chpasswd", "visudo"]
# destructive: refused unless the whole command matches an `allow` regex
destructive = ["rm", "rmdir", "unlink", "shred", "dd", "mkfs", "wipefs", "fdisk", "sfdisk", "gdisk", "parted",
  "truncate", "mv", "cp", "kill", "pkill", "killall", "reboot", "shutdown", "poweroff", "halt",
  "chmod", "chown", "chattr", "crontab", "pacman", "yay", "paru", "dnf", "apt", "apt-get"]
# word prefixes that count as destructive (mkfs.ext4, ...)
destructive_prefixes = ["mkfs."]
# regexes on the normalised command that count as destructive
destructive_patterns = [
  '\bsystemctl\b.*\b(stop|disable|mask|kill|isolate|poweroff|reboot|halt|reset-failed)\b',
  '\bloginctl\b.*\b(terminate|kill|poweroff|reboot)',
  '\bgit\b.*\b(push\b.*(-f\b|--force)|reset\b.*--hard|clean\b|branch\b.*-D\b)',
  '\bfind\b.*\s-(delete|exec)\b',
  '\brsync\b.*--delete',
  '\bflatpak\b.*\b(uninstall|remove)\b',
]
# interpreters and tricks that hide what really runs: treated as destructive
opaque = ["sh", "bash", "zsh", "dash", "fish", "ksh", "eval", "exec", "source", "python", "python3", "perl",
  "ruby", "node", "lua", "xargs", "base64"]
opaque_patterns = ['os\.execute', 'io\.popen']
# overwriting a file with `>` (except /dev/null) counts as destructive
redirect_is_destructive = true
# full-command regexes that may pass the destructive/opaque rules (they are still voted on)
allow = []

[context]
# run before planning; trimmed output is shown to the planner and all units
commands = []
max_chars = 1500


[notify]
enabled = true
command = "notify-send"
app_name = "MAGI"
markup = true                   # pango markup in the card (dunst: markup = full)
timeout_ms = 9000
colors = { approve = "#f5a524", deny = "#e5484d", dim = "#7a675a", accent = "#ff8c1a" }

[voice]
record = ["pw-record", "--rate", "16000", "--channels", "1", "--format", "s16"]
max_seconds = 30
min_rms = 120                   # quieter recordings count as silence (Whisper invents text from silence)
language = ""                   # empty = auto-detect
prompt = ""                     # spelling hints for Whisper (names, jargon)
# shell pipeline that speaks the text it gets on stdin; empty = silent. Piper example:
# tts = "piper --model ~/.local/share/piper/en_US-lessac-medium.onnx --output_raw 2>/dev/null | pw-play --raw --rate 22050 --channels 1 --format s16 -"
tts = ""
speak_output_chars = 300        # how much command output is read aloud when the planner asks for it

# ── Fast path ────────────────────────────────────────────────────────────────
# Phrases in [[commands]] run at once: no planner, no vote (you wrote them yourself).
# A request may chain them: "workspace 3 and fullscreen roblox". Every part must match,
# otherwise the whole request goes to the council as usual.
[fast]
enabled = true
step_delay_ms = 120             # pause between chained steps (lets focus settle)
launch_wait_s = 15              # "open X and fullscreen it": how long to wait for X's window
wake_words = ["magi", "maggie", "margie", "magie", "maji", "mahji", "mogi", "marji", "madgie", "magee", "hey magi", "hey maggie", "okay magi", "ok magi"]
lead_fillers = ["hey", "okay", "ok", "yo", "please", "can you", "could you", "would you", "will you", "i want to", "i want you to", "just", "go ahead and", "lets"]
tail_fillers = ["please", "thanks", "thank you", "for me", "now", "right now"]
fullscreen_cmd = ""             # e.g. "my-fullscreen {address}"; empty = Hyprland's own
done_sound = ""                 # e.g. "pw-play ~/sounds/tick.wav"
own_commands_only = false       # true: your [[commands]] replace the built-in ones (default: they come first)

# Phrase syntax: words; [a|b] optional; (a|b) one of; a_b = "a b" inside brackets;
# slots {n} (number), {level} (number), {app} (an [[apps]] name/alias, an open window's class,
# or it/this/that), {text} (rest, shell-quoted). Number words are digits already ("three" → 3).
# run: a shell command ({n}, {level}, {text}, {app.address}, {app.class}, {app.title}, {app.pid},
# {app.workspace}, {app.fullscreen}) or a built-in action:
#   @workspace  @focus  @open  @close  @fullscreen  @unfullscreen  @move  @special NAME
# reply = spoken after it ran; speak_output = read the command's output aloud.
[[commands]]
say = ["[switch|go] [to] workspace {n}", "desktop {n}"]
run = "@workspace"

[[commands]]
say = ["(move|send|put) {app} to workspace {n}", "(move|send|put) [it|this] to workspace {n}"]
run = "@move"

[[commands]]
say = ["(open|launch|start|run) {app}"]
run = "@open"

[[commands]]
say = ["(focus|show|switch_to|go_to|bring_up) {app}"]
run = "@focus"

[[commands]]
say = ["[make] {app} (fullscreen|full_screen)", "(fullscreen|full_screen) [it|this|that]", "(fullscreen|full_screen) {app}", "make [it|this|that] (fullscreen|full_screen)"]
run = "@fullscreen"

[[commands]]
say = ["(exit|leave|unfullscreen|un_fullscreen) [fullscreen|full_screen]", "(exit|leave|unfullscreen) {app} [fullscreen|full_screen]"]
run = "@unfullscreen"

[[commands]]
say = ["(close|quit) {app}"]
run = "@close"

[[commands]]
say = ["(pause|play|resume) [the] [music|song|track]", "play pause"]
run = "playerctl play-pause"

[[commands]]
say = ["(skip|next) [song|track|this_song|it]", "skip this [song|track]"]
run = "playerctl next"

[[commands]]
say = ["(previous|last|go_back) [song|track]", "play [the] (previous|last) [song|track]"]
run = "playerctl previous"

[[commands]]
say = ["(whats|what_is) (playing|this_song)", "what song is this"]
run = "playerctl metadata --format '{{title}} by {{artist}}'"
speak_output = true

[[commands]]
say = ["[set] volume [to] {level} [percent]"]
run = "wpctl set-volume @DEFAULT_AUDIO_SINK@ {level}%"

[[commands]]
say = ["(volume_up|louder|turn_it_up)", "turn [the] volume up"]
run = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 10%+"

[[commands]]
say = ["(volume_down|quieter|turn_it_down)", "turn [the] volume down"]
run = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-"

[[commands]]
say = ["[what] time is it", "whats the time"]
run = "date '+%H:%M'"
speak_output = true

# ── Always-on listening (`consensus ears run`) ───────────────────────────────
[ears]
# sherpa-onnx keyword-spotting model (English, BPE): encoder/decoder/joiner*.onnx, tokens.txt,
# bpe.vocab. See README → "Wake word".
model_dir = "~/.local/share/magi-consensus/kws"
keywords = ["MAGI", "MAGGIE"]   # any of these wakes it; spelled like they sound
threshold = 0.20                # lower = wakes more easily (and more often by mistake)
score = 2.0                     # boost for keyword paths
threads = 1
record = ["pw-record", "--rate", "16000", "--channels", "1", "--format", "s16", "-"]
preroll_ms = 1500               # audio before the wake word that goes to Whisper too
silence_ms = 800                # this much quiet ends the request
start_timeout_ms = 3000         # give up if nothing is said after the wake word
max_seconds = 10
speech_factor = 3.0             # louder than noise floor × this counts as speech
wake_sound = ""                 # played when it wakes, e.g. "pw-play ~/sounds/wake.wav"
require_wake_word = true        # Whisper must hear a wake word too (cuts false wakes)
