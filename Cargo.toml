[package]
name = "magi-consensus"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local voice assistant where three LLM units vote on every action; it runs only with 2 of 3"
license = "MIT"
repository = "https://github.com/Tjabooo/magi-consensus"
readme = "README.md"
keywords = ["llm", "voice-assistant", "llama-cpp", "whisper", "wayland"]
categories = ["command-line-utilities"]

[[bin]]
name = "consensus"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true
