[package]
name = "magi-consensus"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Local voice assistant: your own phrases run at once, anything else needs 2 of 3 LLM votes"
license = "MIT"
repository = "https://github.com/Tjabooo/magi-consensus"
readme = "README.md"
keywords = ["llm", "voice-assistant", "llama-cpp", "whisper", "wayland"]
categories = ["command-line-utilities"]

[[bin]]
name = "consensus"
path = "src/main.rs"

[dependencies]
regex = "1"
sherpa-onnx = "2.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }  # schema key order = generation order
toml = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
strip = true
